<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Trámite Documentario</title>

<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f5f7fb}
header{background:#1b4d89;color:#fff;padding:15px}
.container{padding:20px}

form{background:#fff;padding:15px;border-radius:10px;display:grid;gap:10px;max-width:400px}
input,button{padding:10px;border-radius:8px;border:1px solid #ccc}
button{background:#1b4d89;color:#fff;border:none;cursor:pointer}

table{width:100%;margin-top:20px;border-collapse:collapse;background:#fff}
th,td{border:1px solid #ddd;padding:8px}
th{background:#eef3fb}
</style>

</head>
<body>

<header>
<h2>Sistema Trámite Documentario</h2>
</header>

<div class="container">

<h3>Registrar Solicitante</h3>

<form id="formSolicitante">
<input type="text" id="dni" placeholder="DNI" required>
<input type="text" id="nombre" placeholder="Nombre" required>
<input type="text" id="telefono" placeholder="Teléfono" required>
<input type="email" id="email" placeholder="Email" required>
<button type="submit">Guardar</button>
</form>

<h3>Lista de Solicitantes</h3>
<div id="tabla"></div>

</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://segumusufzndmovrqdc.supabase.co";
const SUPABASE_KEY = "sb_publishable_8O3HrIpeKAAwPXIaqj3O1Q_ZXZs2Izc";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// GUARDAR
document.getElementById("formSolicitante").addEventListener("submit", async (e) => {
  e.preventDefault();

  const dni = document.getElementById("dni").value.trim();
  const nombre = document.getElementById("nombre").value.trim();
  const telefono = document.getElementById("telefono").value.trim();
  const email = document.getElementById("email").value.trim();

  const { error } = await sb.from("solicitante")
    .insert([{ dni, nombre, telefono, email }]);

  if (error) return alert("Error: " + error.message);

  alert("Guardado en la nube ✔");
  e.target.reset();
  cargar();
});

// MOSTRAR
async function cargar() {
  const { data, error } = await sb
    .from("solicitante")
    .select("*")
    .order("id_cli", { ascending: false });

  if (error) return alert(error.message);

  document.getElementById("tabla").innerHTML = `
    <table>
      <thead>
        <tr>
          <th>ID</th><th>DNI</th><th>Nombre</th><th>Teléfono</th><th>Email</th>
        </tr>
      </thead>
      <tbody>
        ${data.map(x => `
          <tr>
            <td>${x.id_cli}</td>
            <td>${x.dni}</td>
            <td>${x.nombre}</td>
            <td>${x.telefono}</td>
            <td>${x.email ?? ""}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

cargar();
</script>

</body>
</html>
